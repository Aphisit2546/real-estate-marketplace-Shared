project_id = "real-estate-marketplace"

[api]
# Clients never talk to PostgREST. Everything goes through apps/api.
enabled = false

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-locations.sql"]

[auth]
enabled = true
# Change to https://hongmung.com when the site goes live, because email links are built from it.
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "https://hongmung.com/auth/callback",
  "http://localhost:3000/auth/callback",
  "hongmung://auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"

[storage]
enabled = true
file_size_limit = "5MiB"
